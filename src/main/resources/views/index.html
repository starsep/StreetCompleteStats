<!doctype html>
<html lang="en">
    {% include "head.html" %}
    <body>
        <h1 data-pl="Zadania">Quests</h1>
        <span>
            {% for quest in quests %}
            <a href="{{ quest.name }}.html">{% include "questIcon.html" %}</a>
            {% endfor %}
        </span>

        <h1 data-pl="Miasta">Cities</h1>
        <span>
            {% for city in cities %}
            <a href="{{ city.slug }}.html">{{ city.name }}</a>
            {% endfor %}
        </span>
        {% include "footer.html" %}
        <script>
            function preferredLanguage() {
                for (const lang of navigator.languages) {
                    if (lang.startsWith("en")) {
                        return "en";
                    }
                    if (lang.startsWith("pl")) {
                        return "pl";
                    }
                }
                return "en";
            }
            function translateContent() {
                const lang = preferredLanguage();
                document.documentElement.lang = lang;
                if (lang === "pl") {
                    document
                        .querySelectorAll("[data-pl]")
                        .forEach((element) => {
                            element.textContent =
                                element.getAttribute("data-pl");
                        });
                }
            }
            translateContent();
        </script>
    </body>
</html>
